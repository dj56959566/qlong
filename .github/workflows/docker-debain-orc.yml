name: Build QingLong OCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Tesseract Version
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.tesseract
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ghcr.io/${{ github.repository_owner }}/qinglong-ocr-tesseract:latest

      - name: Build and Push Ddddocr Version
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ddddocr
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ghcr.io/${{ github.repository_owner }}/qinglong-ocr-ddddocr:latest
